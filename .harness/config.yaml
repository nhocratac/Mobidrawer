# Harness Engineering config — generated by /harness-init.
# Commit this file; the team tunes it together.
#
# See the plugin's README.md for what each field does.
# Sections marked [TUNE] should be reviewed before running your first sprint.

harness:
  name: harness-eng                       # [TUNE] — rename per service/project
  version: 1.0.0
  artifacts_root: .harness-run/           # runtime artifact location (gitignored)
  config_root: .harness/                  # versioned config location

agents:
  planner:
    model: claude-fable-5                 # strong model for design discipline
    prompt: prompts/planner.md            # hash this file for evaluator_pin
    max_tokens: 8192
    tools: [Read, Grep]                   # read-only, no edits

  generator:
    model: claude-sonnet-5                # cheaper than Planner/Evaluator
    prompt: prompts/generator.md
    tools: [Read, Write, Edit, Bash]
    bash_allowlist:                        # [TUNE] — scope to your build tooling
      - ./mvnw
      - git
      - npm
      - python3

  evaluator:
    model: claude-opus-4-8                # strong model for skepticism
    prompt: prompts/evaluator.md
    tools: [Read, Grep, Bash]             # NO Write/Edit — enforced in /harness-eval
    bash_allowlist:                        # [TUNE] — MUST be sorted alphabetically
      - ./mvnw
      - curl
      - git                                #  (deterministic hashing depends on sort order)
      - npm
      - python3
    isolation: subagent                    # context reset mandatory

orchestration:
  flow: plan -> negotiate -> generate -> evaluate -> decide
  max_sprint_iterations: 3                # >3 usually means contract is wrong, not code
  on_fail: retry_with_feedback
  on_3x_fail: escalate_to_human

  # Cost guardrail — prevents runaway loops from burning budget.
  # Anthropic article cites $9-$200 range per feature; tune to your team's unit economics.
  max_cost_usd_per_sprint: 5.0             # [TUNE] — exceed → abort sprint, escalate
  max_cost_usd_per_day: 50.0               # [TUNE] — whole-harness cap (all parallel sprints)
  max_tokens_per_sprint: 500000            # secondary guardrail (cost ≈ tokens × rate)

observability:
  log_level: info
  persist: .harness-run/telemetry/
  redact:                                  # keys to scrub from telemetry before persist
    - password
    - api_key
    - authorization
    - cookie
    - token
